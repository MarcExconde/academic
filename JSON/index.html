<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>NBA SUPERSTARS</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }

        .nba-header {
            border-bottom: 2px solid #1d4ed8;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .nba-title {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nba-card {
            background: linear-gradient(145deg, #161b22 0%, #0d1117 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .nba-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #17408B 0%, #C9082A 100%);
        }

        .nba-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 25px rgba(23, 64, 139, 0.3);
        }

        .player-img-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #17408B;
            background-color: #161b22;
            flex-shrink: 0;
        }

        .player-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .player-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            color: #ffffff;
            line-height: 1.1;
        }

        .player-age {
            font-size: 0.85rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-family: 'Oswald', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #38edf8;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="nba-header d-flex justify-content-between align-items-center">
            <h1 class="nba-title m-0">NBA SUPERSTARS</h1>
            <span class="badge bg-danger px-3 py-2">STATS</span>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="parent">

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        var players = [
            {
                firstName: "LeBron",
                lastName: "James",
                age: 40,
                isLoggedIn: true,
                image: "https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/1966.png&w=350&h=254",
                stats: [
                    {
                        points: "20.2",
                        assists: "10.2",
                        rebounds: "11.2",
                        steals: "10.2"
                    }
                ],
            },
            {
                firstName: "Kevin",
                lastName: "Durant",
                age: 38,
                isLoggedIn: true,
                image: "https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/3202.png&w=350&h=254",
                stats: [
                    {
                        points: "25.3",
                        assists: "12.2",
                        rebounds: "9.2",
                        steals: "12.2"
                    },
                ],
            },
            {
                firstName: "Stephen",
                lastName: "Curry",
                age: 35,
                isLoggedIn: true,
                image: "https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/3975.png&w=350&h=254",
                stats: [
                    {
                        points: "20.2",
                        assists: "11.2",
                        rebounds: "3.2",
                        steals: "11.2"
                    },

                ],
            },
            {
                firstName: "Giannis",
                lastName: "Antetokounmpo",
                age: 31,
                isLoggedIn: true,
                image: "https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/3032977.png&w=350&h=254",
                stats: [
                    {
                        points: "22.2",
                        assists: "9.2",
                        rebounds: "10.2",
                        steals: "9.2"
                    },
                ],
            },
            {
                firstName: "Tyrese",
                lastName: "Haliburton",
                age: 26,
                isLoggedIn: true,
                image: "https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/4396993.png&w=350&h=254",
                stats: [
                    {
                        points: "21.2",
                        assists: "10.2",
                        rebounds: "6.2",
                        steals: "10.2"
                    },
                ],
            },
            {
                firstName: "Kawhi",
                lastName: "Leonard",
                age: 35,
                isLoggedIn: true,
                image: "https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/6450.png&w=350&h=254",
                stats: [
                    {
                        points: "19.2",
                        assists: "8.2",
                        rebounds: "7.2",
                        steals: "8.2"
                    },
                ],
            }

        ];

        var elParent = document.getElementById("parent");
        var htmlContent = "";

        for (var i = 0; i < players.length; i++) {
            var player = players[i];
            var stat = player.stats[0];
            var statusClass = player.isLoggedIn ? "bg-success" : "bg-secondary";
            var statusText = player.isLoggedIn ? "Active" : "Offline";

            htmlContent += `
                <div class="col">
                    <div class="card nba-card p-4 h-100">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="badge status-badge ${statusClass}">${statusText}</span>
                            <span class="player-age">Age: ${player.age}</span>
                        </div>

                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="player-img-container">
                                <img src="${player.image}" alt="${player.firstName} ${player.lastName}" class="player-img" />
                            </div>
                            <div>
                                <div class="player-name">${player.firstName}<br><span class="fw-bold text-primary">${player.lastName}</span></div>
                            </div>
                        </div>

                        <div class="mt-auto">
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-value">${stat.points}</span>
                                    <span class="stat-label">PTS</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value">${stat.rebounds}</span>
                                    <span class="stat-label">REB</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value">${stat.assists}</span>
                                    <span class="stat-label">AST</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value">${stat.steals}</span>
                                    <span class="stat-label">STL</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        elParent.innerHTML = htmlContent;
    </script>
</body>

</html>
