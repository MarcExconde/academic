<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hoops - NBA TEAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f7f8f9;
            color: #1e2d3d;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }

        .nba-header {
            background: linear-gradient(180deg, #1d428a 0%, #17356e 100%);
            border-bottom: 3px solid #c8102e;
        }

        .nba-title {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nba-card {
            background-color: #ffffff;
            border: 1px solid #e1e3e5;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .nba-card:hover {
            transform: translateY(-2px);
            border-color: #1d428a;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .nba-badge {
            font-weight: 600;
            font-size: 0.85rem;
            color: #112233 !important;
            letter-spacing: 0.5px;
        }

        .nba-badge-sub {
            background-color: #f0f2f4 !important;
            color: #1e2d3d !important;
            border: 1px solid #e1e3e5;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .pagination .page-link {
            background-color: #ffffff;
            border-color: #e1e3e5;
            color: #1e2d3d;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 18px;
        }

        .pagination .page-link:hover {
            background-color: #f0f2f4;
            border-color: #e1e3e5;
            color: #1d428a;
        }

        #currentpage {
            background-color: #c8102e !important;
            border-color: #c8102e !important;
            color: #ffffff !important;
        }

        .team-link {
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .team-link:hover {
            opacity: 0.9;
        }

        .logo-box {
            background-color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #e1e3e5;
        }
    </style>
</head>

<body>
    <div class="container-fluid nba-header position-fixed top-0 z-1 shadow-sm">
        <div class="row">
            <div class="col">
                <div class="text-center display-6 text-white py-3 nba-title">NBA TEAMS</div>
            </div>
        </div>
    </div>

    <div class="container mt-5 pt-5">
        <nav aria-label="Page navigation example" class="d-flex justify-content-center my-4">
            <ul class="pagination shadow-sm mb-0">
                <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
                <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
                <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
            </ul>
        </nav>
    </div>

    <div class="container">
        <div class="row" id="parent">

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        
        const colors = {
            Eastern: '#DEF3FD',
            Western: '#FDDFDF',
            none: '#F5F5F5',
            lakers: '#552583',       
            celtics: '#007A33',      
            bulls: '#CE1141',       
            warriors: '#1D428A',     
            heat: '#98002E',         
            knicks: '#F58426',      
            nets: '#000000',        
            bucks: '#00471B',        
            suns: '#E56020',         
            mavericks: '#00538C',    
            sixers: '#006BB6',
            '76ers': '#006BB6',       
            nuggets: '#0E2240',      
            clippers: '#C8102E',     
            raptors: '#CE1141',     
            spurs: '#C4CED4'        
        };

        const nbaTeamIds = {
          ATL: 1610612737, BOS: 1610612738, CLE: 1610612739, NOP: 1610612740,
          CHI: 1610612741, DAL: 1610612742, DEN: 1610612743, GSW: 1610612744,
          HOU: 1610612745, LAC: 1610612746, LAL: 1610612747, MIA: 1610612748,
          MIL: 1610612749, MIN: 1610612750, BKN: 1610612751, NYK: 1610612752,
          ORL: 1610612753, IND: 1610612754, PHI: 1610612755, PHX: 1610612756,
          POR: 1610612757, SAC: 1610612758, SAS: 1610612759, OKC: 1610612760,
          TOR: 1610612761, UTA: 1610612762, MEM: 1610612763, WAS: 1610612764,
          DET: 1610612765, CHA: 1610612766
        };

        const abbrAliases = { GS: 'GSW', NY: 'NYK', SA: 'SAS', NO: 'NOP', BK: 'BKN', PHO: 'PHX', UTAH: 'UTA', WSH: 'WAS', CHO: 'CHA', NOR: 'NOP' };
        function logoHtml(abbreviation, size) {
          var abbr = (abbreviation || '').toUpperCase();
          abbr = abbrAliases[abbr] || abbr;
          var teamId = nbaTeamIds[abbr];
          if (!teamId) return abbreviation;
          return `<img src="https://cdn.nba.com/logos/nba/${teamId}/global/L/logo.svg"
                       alt="${abbreviation}" style="width:${size}px; height:${size}px; object-fit:contain;"
                       onerror="this.replaceWith(document.createTextNode('${abbreviation}'))">`;
        }

        function capitalizeFirstLetter(str) {
            if (!str) return str; 
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        var elCurrentPage = document.getElementById("currentpage");
        var elParent = document.getElementById("parent");

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        var page = urlParams.get('page');
        if (page == null) {
            page = 1;
        } else {
            page = parseInt(page);
        }

        var apiKey = 'DcjjykXhWaR67kcPOzmY8qsCrGeDG4UeYJI2nC9P';
        var apiUrl = 'https://api.api-ninjas.com/v1/basketballteams?league=nba';
        var teams = [];

        var perPage = 6;
        var finalPage = 1; 

        const getTeams = async () => {
            elParent.innerHTML = `
              <div class="col-12 text-center py-5">
                <div class="h3 my-3 text-muted" id="name">
                  <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                </div>
              </div>
            `;
            elCurrentPage.innerHTML = page;

            if (teams.length == 0) {
                const response = await fetch(apiUrl, {
                    headers: { 'X-Api-Key': apiKey }
                });
                teams = await response.json();
                finalPage = Math.ceil(teams.length / perPage);
            }

            elParent.innerHTML = '';

            for (var i = (page - 1) * perPage; i < page * perPage && i < teams.length; i++) {

                var team = teams[i];

                var id = team.team_id;
                var abbreviation = team.abbreviation;
                var name = team.name;
                var conference = team.conference;
                var division = team.division;
                var color = colors[conference] || colors.none;
                var teamColor = colors[team.nickname.toLowerCase()] || '#212529';

                elParent.innerHTML += `
          <div class="col-12">
            <div class="card nba-card shadow-sm p-3 d-flex flex-row align-items-center my-2">
              <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold logo-box" style="width: 70px; height: 70px; color: `+ teamColor + `;">
                `+ logoHtml(abbreviation, 50) + `
              </div>
              <a class="team-link" href="view.html?id=`+ id + `&page=` + page + `">
                <div class="h4 mx-4 my-0" style="color: `+ teamColor + `;">`+ name + `</div>
              </a>
              <div class="rounded-pill px-3 me-2 nba-badge" style="background-color: `+ color + `;">` + capitalizeFirstLetter(conference) + `</div>
              <div class="rounded-pill px-3 nba-badge-sub">`+ division + `</div>
            </div>
          </div>
        `;
            }
        }

        function prev() {
            page -= 1;
            if (page == 0) {
                page = finalPage;
            }
            getTeams();
        }

        function next() {
            page += 1;
            if (page > finalPage) {
                page = 1;
            }
            getTeams();
        }

        getTeams();
    </script>
</body>

</html>
